[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "knowledge_distillation_keras"
version = "0.1.0"
description = "A professional repository demonstrating Knowledge Distillation in Keras."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "tensorflow>=2.15.0",
    "numpy>=1.26.0",
    "matplotlib>=3.8.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "mypy",
    "flake8"
]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = [
    "tests",
]
